name: 'CI - Validation'

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Validate Shell Scripts
        run: |
          echo "Checking shell script syntax..."
          bash -n zphisher.sh
          bash -n make-deb.sh
          bash -n run-docker.sh
          bash -n scripts/launch.sh
          echo "✓ All shell scripts are valid"

      - name: Check File Permissions
        run: |
          echo "Checking executable permissions..."
          if [ ! -x zphisher.sh ]; then
            echo "✗ zphisher.sh is not executable"
            exit 1
          fi
          if [ ! -x make-deb.sh ]; then
            echo "✗ make-deb.sh is not executable"
            exit 1
          fi
          if [ ! -x run-docker.sh ]; then
            echo "✗ run-docker.sh is not executable"
            exit 1
          fi
          echo "✓ All required main scripts are executable"

      - name: Validate Dockerfile
        run: |
          echo "Validating Dockerfile syntax..."
          if ! docker build --help >/dev/null 2>&1; then
            echo "⚠ Docker is not available, skipping Docker validation"
            exit 0
          fi
          
          # Define network error patterns
          NETWORK_ERROR_PATTERNS="TLS: unspecified error|unable to select packages|connection refused|network unreachable"
          
          echo "Building Docker image (may fail due to network issues in CI)..."
          if docker build --no-cache -t zphisher:test . 2>&1 | tee /tmp/docker-build.log; then
            echo "✓ Dockerfile build succeeded"
          else
            if grep -qE "$NETWORK_ERROR_PATTERNS" /tmp/docker-build.log; then
              echo "⚠ Docker build failed due to network/registry issues (expected in some CI environments)"
              echo "✓ Dockerfile syntax appears valid"
            else
              echo "✗ Docker build failed with unexpected error"
              cat /tmp/docker-build.log | tail -50
              exit 1
            fi
          fi

      - name: Validate Docker Compose
        run: |
          echo "Validating docker-compose.yml..."
          if ! docker compose version >/dev/null 2>&1; then
            echo "⚠ Docker Compose is not available, skipping validation"
            exit 0
          fi
          docker compose config >/dev/null
          echo "✓ docker-compose.yml is valid"

      - name: Test Docker Container
        run: |
          echo "Testing Docker container..."
          if ! docker images | grep -q "zphisher:test"; then
            echo "⚠ Docker image not built, skipping container test"
            exit 0
          fi
          docker run --rm zphisher:test bash -c "ls -la && [ -f zphisher.sh ] && bash -n zphisher.sh"
          echo "✓ Docker container works correctly"

      - name: Validate Package Structure
        run: |
          echo "Checking required files and directories..."
          for file in zphisher.sh README.md LICENSE Dockerfile docker-compose.yml DEPLOYMENT.md; do
            if [ ! -f "$file" ]; then
              echo "✗ Missing required file: $file"
              exit 1
            fi
          done
          
          for dir in .sites scripts .github; do
            if [ ! -d "$dir" ]; then
              echo "✗ Missing required directory: $dir"
              exit 1
            fi
          done
          echo "✓ All required files and directories present"

      - name: Check Documentation
        run: |
          echo "Checking documentation files..."
          if ! grep -q "Deployment" README.md DEPLOYMENT.md; then
            echo "⚠ Warning: Deployment information might be missing"
          fi
          echo "✓ Documentation check complete"
